# The `dsh-session-cost-routerai` bundle patch: mounts the cost meter.
#
# EXACTLY ONE ROW, and that is load-bearing. This package declares `dsh.client`,
# so the client-module scanner resolves a row name to a package and refuses two
# sources for one package ("resolves from multiple active Loader sources"). A
# second row naming this package would not merely be redundant — it would fail
# the composition and abort boot. Both registration surfaces therefore live in
# the single `index.js` below.
#
# The row name is a BARE package name, which is both the shipped-bundle
# convention and a hard requirement here: `exactPackageSpecifier` in the client
# scanner returns undefined for a subpath like `pkg/sub`, so a subpath row would
# silently never contribute a browser half.

- insert:
    - id: session-cost
      name: 'dsh-session-cost-routerai'
      config:
        # RouterAI API root. Must match the adapter's `llm-deepseek.baseURL`:
        # the meter observes the harness's own model requests and prices them
        # by the `X-Generation-Id` header, so a different root yields no data.
        baseURL: https://routerai.ru/api/v1
        # Credential reference for the per-generation cost lookup and the key's
        # own spend and balance. Resolution order: a literal `apiKey`, then the
        # credentials store (the Web Models page writes it), then this env name.
        apiKeyEnv: DEEPSEEK_API_KEY
        # Where the per-session totals survive a restart. The default is
        # $DSH_HOME/storages/session-cost-routerai.json (usually
        # ~/.dsh/storages/...); set an explicit path to move it, or null to keep
        # the totals in memory only.
        # statePath: ~/.dsh/storages/session-cost-routerai.json
        # Turn the fetch observer off to disable billing observation entirely;
        # the pill then shows token counts and the key figures only.
        trackCost: true
